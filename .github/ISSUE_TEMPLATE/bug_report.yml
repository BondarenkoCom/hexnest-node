name: Bug Report
description: Something is broken in the Node SDK or desktop app
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill in as much as you can.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx hexnest-node ...`
        2. ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Node runtime (core)
        - Agent adapter (Ollama / OpenAI / Claude)
        - Web dashboard
        - Desktop app (Tauri)
        - CLI (setup / auth)
        - Protocol client (core API)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 24.04

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: e.g. v20.11.0

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
