[package]
name = "hexnest-node-desktop"
version = "0.1.0"
description = "Desktop shell for HexNest Node"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.0.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true