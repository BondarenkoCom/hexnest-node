<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexNest Node</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #04060a;
        --deep: #07111b;
        --cyan: #4ad9ff;
        --cyan-soft: rgba(74, 217, 255, 0.4);
        --blood: #a20f52;
        --text: #eef5ff;
        --muted: #9dbdd8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        height: 100vh;
        background: var(--void);
        color: var(--text);
        font-family: 'Oxanium', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 15% 15%, rgba(162, 15, 82, 0.12), transparent 45%),
          radial-gradient(circle at 85% 85%, rgba(74, 217, 255, 0.12), transparent 45%),
          linear-gradient(to bottom, #07111b 0%, #04060a 100%);
        z-index: -1;
      }

      /* Scanlines effect */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 1px,
          transparent 1px,
          transparent 2px
        );
        z-index: 10;
        opacity: 0.3;
      }

      .loader-container {
        text-align: center;
        max-width: 420px;
        width: 100%;
        padding: 40px;
        position: relative;
      }

      .logo-shell {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
      }

      .logo-pulse {
        position: absolute;
        inset: -10px;
        border: 2px solid var(--cyan);
        border-radius: 24px;
        opacity: 0;
        animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .logo-core {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a1f33 0%, #050e17 100%);
        border: 2px solid var(--cyan-soft);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(74, 217, 255, 0.15);
        overflow: hidden;
      }

      .hex-icon {
        width: 60px;
        height: 60px;
        fill: var(--cyan);
        filter: drop-shadow(0 0 8px var(--cyan));
        animation: logo-float 4s ease-in-out infinite;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin: 0 0 12px;
        color: var(--text);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }

      .status {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.85rem;
        color: var(--muted);
        height: 1.2em;
        margin-bottom: 24px;
        letter-spacing: 0.05em;
      }

      .progress-rail {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar {
        position: absolute;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(to right, transparent, var(--cyan), transparent);
        animation: progress-slide 2s linear infinite;
      }

      .meta {
        margin-top: 32px;
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 0.7rem;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(74, 217, 255, 0.4);
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.9); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      @keyframes logo-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes progress-slide {
        from { left: -40%; }
        to { left: 100%; }
      }

      [data-state="error"] {
        color: #ff4a6b !important;
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <div class="logo-shell">
        <div class="logo-pulse"></div>
        <div class="logo-core">
          <svg class="hex-icon" viewBox="0 0 24 24">
            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" />
          </svg>
        </div>
      </div>
      
      <h1>Initializing</h1>
      <div id="status" class="status">Negotiating local control channel...</div>
      
      <div class="progress-rail">
        <div class="progress-bar"></div>
      </div>

      <div class="meta">
        <div id="mode">Desktop Shell</div>
        <div>v0.1.0</div>
      </div>
    </div>

    <script>
      window.__HEXNEST_DESKTOP__ = {
        setStatus(message) {
          const status = document.getElementById("status");
          if (status) status.textContent = message;
        },
        setError(message) {
          const status = document.getElementById("status");
          if (status) {
            status.textContent = message;
            status.dataset.state = "error";
          }
          const bar = document.querySelector(".progress-bar");
          if (bar) bar.style.display = "none";
        },
        setMode(message) {
          const mode = document.getElementById("mode");
          if (mode) mode.textContent = message;
        },
        setHint(message) {
          // Hints can be displayed in status or a separate area
          console.log("Hint:", message);
        }
      };
    </script>
  </body>
</html>
