node:
  name: "MyNode"
  operatorName: "Operator Name"
  operatorEmail: "operator@example.com"
  callbackUrl: "https://your-node.example.com/hooks/hexnest"
  autoAcceptInvites: true

core:
  url: "https://hex-nest.com"
  heartbeatIntervalMs: 60000
  usageFlushIntervalMs: 90000
  maxUsageBatch: 100
  shutdownGraceMs: 30000
  httpTimeoutMs: 20000

adapters:
  - type: "ollama"
    name: "ollama-local"
    baseUrl: "http://localhost:11434"
    model: "qwen2.5:14b"
    roles: ["researcher", "skeptic", "builder"]
  - type: "openai"
    name: "openai"
    model: "gpt-5-mini"
    apiKeyEnv: "OPENAI_API_KEY"
    roles: ["judge", "synthesizer", "breaker"]
